name: API

# Called by deploy.yml, which owns the trigger, the path filter and the
# CDK → API → Frontend ordering. Never triggered on push directly.
on:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & Deploy Go Binary
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-account-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set environment
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          elif [ "$BRANCH" = "staging" ]; then
            echo "ENVIRONMENT=stage" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      - name: Build arm64 binary
        working-directory: api
        run: |
          SHORT_SHA="${{ github.sha }}"
          # Format: YYMMDDHHMM:<7-char commit> — consumed by the app via APP_VERSION
          VERSION="$(date -u '+%y%m%d%H%M'):${SHORT_SHA:0:7}"
          # Filesystem-safe variant for the S3 artifact name (no ':')
          echo "ARTIFACT_VERSION=$(date -u '+%y%m%d%H%M')-${SHORT_SHA:0:7}" >> "$GITHUB_ENV"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bootstrap ./cmd/api
          # Ship the version as an env file inside the artifact; start.sh sources it
          # so the running app exposes it via APP_VERSION (health check releaseId).
          echo "APP_VERSION=${VERSION}" > release.env

      - name: Package
        working-directory: api
        run: zip -j release.zip bootstrap release.env

      - name: Read deployment config from SSM
        run: |
          BUCKET=$(aws ssm get-parameter --name "/ctech/$ENVIRONMENT/s3/deployments-bucket" --query Parameter.Value --output text 2>/dev/null || echo "${ENVIRONMENT}-ctech-deployments")
          ASG_NAME="${ENVIRONMENT}-ctech-account"
          echo "DEPLOYMENTS_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV

      - name: Upload artifact to S3
        working-directory: api
        run: |
          aws s3 cp release.zip "s3://$DEPLOYMENTS_BUCKET/ctech-account/current.zip"
          aws s3 cp release.zip "s3://$DEPLOYMENTS_BUCKET/ctech-account/api-${ARTIFACT_VERSION}.zip"

      - name: Deploy via ASG instance refresh
        run: |
          # The SSM agent is disabled on these instances, so a deploy replaces
          # them instead of running /opt/app/deploy.sh over RunCommand. New
          # instances bootstrap current.zip from S3, which the previous step
          # just overwrote.
          #
          # MinHealthyPercentage=0 launches no replacement before the old
          # instance is gone: the service is DOWN for the length of the refresh.
          # Deliberate while this is a development environment on one t4g.nano.
          # SkipMatching must stay false — the launch template is unchanged by a
          # deploy, so a matching check would skip every instance.
          DESIRED=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text)
          if [ "$DESIRED" = "0" ] || [ "$DESIRED" = "None" ]; then
            echo "ASG $ASG_NAME is scaled to zero (outside the schedule window); the next instance boots this artifact."
            exit 0
          fi

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":0,"SkipMatching":false}' \
            --query InstanceRefreshId --output text)
          echo "Instance refresh $REFRESH_ID started"

          # There is no `aws autoscaling wait` for instance refreshes.
          for _ in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' --output text)
            case "$STATUS" in
              Successful)
                echo "Instance refresh completed"
                exit 0
                ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "::error::Instance refresh ended as $STATUS"
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --instance-refresh-ids "$REFRESH_ID" \
                  --query 'InstanceRefreshes[0].StatusReason' --output text
                exit 1
                ;;
            esac
            echo "Status: $STATUS"
            sleep 15
          done
          echo "::error::Instance refresh did not finish within 15 minutes"
          exit 1
