name: Frontend

# Called by deploy.yml, which owns the trigger, the path filter and the ordering.
# Never triggered on push.
#
# The build, the security headers, the export guards and the deploy all live in
# ctech-cdk's reusable workflow. What stays here is what is specific to this
# service: the NEXT_PUBLIC_* values, and the CSP directives that are not derived
# from them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-account
      # false because the route on the real hostname is the only public origin this
      # app should have. `wrangler triggers deploy` already disabled workers.dev at
      # cutover; this is what stops the next CI deploy from turning it back on.
      prod-workers-dev: false
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_DEV }}
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_STAGE }}
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_PROD }}
      # blob: for the KYC document capture preview, media-src for its camera
      # stream. Ported from contentSecurityPolicyDirectives in
      # cdk/lib/frontend-stack.ts:41-51.
      csp-overrides: |
        img-src 'self' data: blob:
        media-src 'self' blob:
        script-src 'self' https://challenges.cloudflare.com
        frame-src 'self' https://challenges.cloudflare.com
