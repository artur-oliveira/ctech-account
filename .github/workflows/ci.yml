name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Go Build & Test
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
          cache: true

      - name: Download dependencies
        working-directory: api
        run: go mod download

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Build (arm64 — matches prod)
        working-directory: api
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/api

      - name: Test (race)
        working-directory: api
        run: go test ./... -race -count=1

      # Pinned, so a new release cannot turn CI red on a day nobody changed code;
      # bump deliberately. Built against a pinned x/tools too: staticcheck's own
      # x/tools cannot read the export data of a newer Go patch.
      - name: Build staticcheck
        run: |
          dir=$(mktemp -d)
          (cd "$dir" && go mod init staticcheck >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@v0.8.2 golang.org/x/tools@v0.52.0 \
            && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)

      - name: Staticcheck
        working-directory: api
        run: $RUNNER_TEMP/staticcheck ./...

      # Reports only vulnerabilities this code can reach, so a finding is always
      # a call path with something concrete to do about it.
      - name: Vulnerability scan
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  cdk:
    name: CDK Synth
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci

      - name: CDK Synth (dev)
        env:
          ENVIRONMENT: dev
          CTECH_VPC_ID: vpc-placeholder   # synth does not resolve lookups
        run: npx cdk synth --quiet 2>&1 | head -5 || true
        # Full synth requires AWS credentials; this just checks TypeScript compiles.

      - name: TypeScript Check
        run: npx tsc --noEmit

  # The UI's own checks, on the pull request. Until this job existed they ran
  # only inside the deploy (ctech-cdk's frontend-cloudflare.yml), after the
  # merge — which is how #46 passed review and then failed the frontend deploy
  # on an unhandled rejection vitest caught. A check that can only fail after
  # main has moved is a check that reports a broken main.
  frontend:
    name: UI Lint, Types & Tests
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci`, never `npm install`: it installs the lockfile exactly and fails
      # when package.json and the lockfile disagree.
      - run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      # Judged by vitest's exit code, which counts unhandled errors and
      # rejections as failures even when every test passes — the case that
      # broke the deploy.
      - name: Tests
        run: npm test

      # Per-route first-load JS against ui/bundle-budget.json, measured on the
      # same plain `next build` export the deploy publishes.
      - name: Build static export
        run: npm run build

      - name: Bundle budget
        run: npm run bundle:check
